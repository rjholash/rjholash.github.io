experience:
- position: Assistant Professor (Teaching)
  institution: University of Calgary, Faculty of Kinesiology
  start_year: 2020
  description: Lead instructor for undergraduate and graduate courses in muscle physiology,
    exercise testing, and computational modeling. Active in course development, pedagogical
    innovation, and undergraduate research mentorship.
- position: Instructor / Lab Coordinator / Curriculum Developer
  institution: University of Calgary, Faculty of Kinesiology
  start_year: 2000
  end_year: 2020
  description: Developed and delivered hands-on laboratory instruction in exercise
    physiology. Led digital transition and hybrid course design, including flipped
    and experiential learning environments.
- position: Outdoor Education Specialist & High-Performance Coach
  institution: Various institutions in Alberta
  start_year: 1993
  end_year: 2000
  description: Designed and led outdoor leadership programs with a focus on experiential
    learning and physical literacy.
