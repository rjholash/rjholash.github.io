<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN" "http://www.w3.org/TR/REC-html40/loose.dtd"> <html><body> <p>This graduate research project analyzes the mechanical properties and fatigue response of single muscle fibers collected from children with cerebral palsy. The goal is to understand muscle contractile deficits and recovery using in vitro testing methods.</p> </body></html>
