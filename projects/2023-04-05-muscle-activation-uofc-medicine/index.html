<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN" "http://www.w3.org/TR/REC-html40/loose.dtd"> <html><body> <p>This interdisciplinary collaboration with the Cumming School of Medicine investigates muscle activation patterns using EMG and mechanomyography. The project evaluates how neural and mechanical signals change with fatigue and training, with implications for rehabilitation and sports performance.</p> </body></html>
